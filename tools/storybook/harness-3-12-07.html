<!DOCTYPE html><html><head><meta charset="utf-8">
<!-- 3.12.07 Learn video: "Fold, Match, Count". Frames rendered by render.js from a timeline (estimated until voiced: timeline-3-12-07-est.json). -->
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#FBF6EA;font-family:Nunito,Arial,sans-serif}
#st{position:absolute;inset:0}
.cap{position:absolute;left:90px;right:90px;bottom:22px;min-height:52px;background:rgba(14,28,66,.88);color:#fff;border-radius:14px;padding:10px 20px;font-size:26px;font-weight:800;line-height:1.3;text-align:center}
.cap:empty{display:none}
.hd{position:absolute;left:40px;top:22px;font-family:'Cormorant Garamond',Georgia,serif;font-size:32px;font-weight:700;color:#3A2A12}
.hd small{display:block;font-family:Nunito,Arial;font-size:15px;letter-spacing:.18em;color:#B8892E;font-weight:900}
.book{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#FFF8E6,#EFE2C6)}
.book.on{display:flex}
.bk{display:grid;grid-template-columns:420px 420px;background:#E8DCC0;padding:12px;border-radius:10px;box-shadow:0 20px 40px rgba(60,40,10,.25)}
.pg{background:#FFFBF1;height:380px;padding:24px;box-sizing:border-box}
.pg img{width:100%;height:290px;object-fit:cover;border:8px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.2);box-sizing:border-box}
.pg.r{display:flex;flex-direction:column;justify-content:center}
.ch{font-family:Georgia,serif;letter-spacing:.2em;color:#B8892E;font-weight:700;font-size:16px}

.owl{position:absolute;width:140px;right:28px;bottom:150px}
</style></head><body>
<div id="st"><svg id="sv" width="1280" height="720" viewBox="0 0 1280 720"></svg>
<div class="hd"><small>CHAPTER 12 · EUCLID'S COMPASS</small>Fold, Match, Count</div></div>
<div class="book" id="book"><div class="bk"><div class="pg"><img src="../repo/images/storybook/sb-byrne-prop1.jpg" style="object-fit:cover"></div><div class="pg r"><div class="ch">CHAPTER 12 · LESSON 7</div><div class="tt" id="btt">Lines of Symmetry</div><div class="q" id="bq">How can a fold show that two halves match?</div></div></div><img class="owl" src="../repo/images/storybook/opti-owl.png"></div>
<div class="cap" id="cap"></div>
<script>
var TL=null, NSV='http://www.w3.org/2000/svg';
function S(tag,a,p){var e=document.createElementNS(NSV,tag);for(var k in a){if(k==='text')e.textContent=a[k];else e.setAttribute(k,a[k]);}(p||sv).appendChild(e);return e;}
var NV='#0E1C42', GR='#1E8C5A', RED='#B23A2E', GRAY='#5B6478', GOLD='#C9A227', OK='#1E7A4C', NO='#B23A2E', PAP='#EFE0BC', PAPL='#F6ECD2', LG='#8792A8', ROAD='#C9CFDC';
function sec(s){return TL.secs[s];}
var M='vid-math';
function wt(re,n){var Wd=sec(M).words,c=0;for(var i=0;i<Wd.length;i++){if(re.test(Wd[i].w.replace(/[^\w'-]/g,''))){if(c===(n||0))return Wd[i].t;c++;}}return null;}
function ease(x){x=Math.max(0,Math.min(1,x));return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;}
function caption(t){var all=[];['vid-open',M,'vid-close'].forEach(function(s){var Wd=sec(s).words,cur=[];Wd.forEach(function(w,i){cur.push(w);if(/[.!?:]$/.test(w.w)||i===Wd.length-1){all.push(cur);cur=[];}});});
  for(var i=0;i<all.length;i++){var a=all[i][0].t,b=all[i][all[i].length-1].e+0.35;if(t>=a-0.1&&t<=b)return all[i].map(function(w){return w.w;}).join(' ');}return '';}
var K={};
function big(x,y,txt,col,size,op){return S('text',{x:x,y:y,'text-anchor':'middle','font-size':size||40,'font-weight':900,fill:col||NV,opacity:op==null?1:op,text:txt});}
function pill(x,y,txt,col,op,fs){fs=fs||24;var g=S('g',{opacity:op==null?1:op});var w=txt.length*fs*.56+34;S('rect',{x:x-w/2,y:y-24,width:w,height:48,rx:24,fill:'#fff',stroke:col,'stroke-width':3},g);S('text',{x:x,y:y+fs*.36,'text-anchor':'middle','font-size':fs,'font-weight':900,fill:col,text:txt},g);return g;}
function fadeIn(t,a,d){return ease((t-a)/(d||0.4));}
function P(v,d,r){var a=d*Math.PI/180;return {x:v.x+r*Math.cos(a),y:v.y-r*Math.sin(a)};}
function ln(a,b,col,w,op,dash){return S('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:col,'stroke-width':w||7,'stroke-linecap':'round',opacity:op==null?1:op,'stroke-dasharray':dash||''});}
function sqmark(v,b,col,op,s){s=s||30;var p1=P(v,b,s),p2=P(p1,b+90,s),p3=P(v,b+90,s);S('polyline',{points:[p1,p2,p3].map(function(p){return p.x+','+p.y;}).join(' '),fill:'none',stroke:col||GR,'stroke-width':4,opacity:op==null?1:op});}
function arcD(v,r,a0,a1){var p=P(v,a0,r),q=P(v,a1,r);return 'M'+p.x+' '+p.y+' A'+r+' '+r+' 0 '+(a1-a0>180?1:0)+' 0 '+q.x+' '+q.y;}
// an angle like the tools-site Protractor arms: navy ray, green ray, square mark at a right angle, navy vertex dot
function angle(v,b,a,L1,L2,col,op,opt){opt=opt||{};ln(v,P(v,b,L1),NV,opt.w||8,op);ln(v,P(v,b+a,L2),col||GR,opt.w||8,op);
  if(Math.abs(a-90)<0.5)sqmark(v,b,col||GR,op);
  else if(a>0.5)S('path',{d:arcD(v,opt.r||60,b,b+a),fill:'none',stroke:col||GR,'stroke-width':4,opacity:op});
  S('circle',{cx:v.x,cy:v.y,r:9,fill:NV,opacity:op==null?1:op});}
// the folded papyrus checker: square corner at c, straight edges along rot and rot+90, torn outer edge
function checker(c,rot,size,op){var p1=P(c,rot,size),p2=P(c,rot+90,size);var pts=[c.x+','+c.y,p1.x+','+p1.y];
  for(var i=1;i<6;i++){var a=rot+15*i,r=size*(0.96+0.1*Math.sin(i*2.7));var q=P(c,a,r);pts.push(q.x+','+q.y);}
  pts.push(p2.x+','+p2.y);
  S('polygon',{points:pts.join(' '),fill:PAP,'fill-opacity':.92,stroke:'#C8B080','stroke-width':2.5,opacity:op==null?1:op});
  sqmark(c,rot,'#A58B4F',op,18);}
// torn scrap outline (bumpy all round), centered at c
function scrap(c,w,h,op,flatBottom,flatLeft){var pts=[],B=18;
  function push(x,y,bump){pts.push((x+(bump?B*Math.sin(x*.13+y*.11):0))+','+(y+(bump?B*Math.cos(x*.09-y*.12):0)));}
  var x0=c.x-w/2,x1=c.x+w/2,y0=c.y-h/2,y1=c.y+h/2;
  for(var x=x0;x<=x1;x+=40)push(x,y0,true);
  for(var y=y0;y<=y1;y+=40)push(x1,y,true);
  for(var x=x1;x>=x0;x-=40)push(x,y1,!flatBottom);
  for(var y=y1;y>=y0;y-=40)push(x0,y,!flatLeft);
  S('polygon',{points:pts.join(' '),fill:PAP,stroke:'#C8B080','stroke-width':2.5,opacity:op==null?1:op});}
var ROD=[null,['#F7F5EE','#0E1C42'],['#E03C31','#fff'],['#7BC043','#fff'],['#8E44AD','#fff'],['#F4D03F','#0E1C42'],['#1E7B34','#fff'],['#2C2C2C','#fff'],['#8B5A2B','#fff'],['#2E86DE','#fff'],['#F08A24','#fff']];
var U=70;
function rod(A,B,n,op){var T=30,dx=B.x-A.x,dy=B.y-A.y,L=Math.hypot(dx,dy)||1,nx=-dy/L*T/2,ny=dx/L*T/2;var g=S('g',{opacity:op==null?1:op});
  S('polygon',{points:[[A.x+nx,A.y+ny],[B.x+nx,B.y+ny],[B.x-nx,B.y-ny],[A.x-nx,A.y-ny]].map(function(p){return p[0]+','+p[1];}).join(' '),fill:ROD[n][0],stroke:'rgba(0,0,0,.45)','stroke-width':2},g);
  var a=Math.atan2(dy,dx)*180/Math.PI;if(a>90)a-=180;if(a<-90)a+=180;var m={x:(A.x+B.x)/2,y:(A.y+B.y)/2};var t=S('text',{x:m.x,y:m.y+7,'text-anchor':'middle','font-size':20,'font-weight':800,fill:ROD[n][1],text:String(n)},g);t.setAttribute('transform','rotate('+a+' '+m.x+' '+m.y+')');return g;}
function apex(A,c,a,b){var x=(a*a-b*b+c*c)/(2*c),h=Math.sqrt(Math.max(0,a*a-x*x));return {x:A.x+x*U,y:A.y-h*U};}
function lerp(a,b,k){return {x:a.x+(b.x-a.x)*k,y:a.y+(b.y-a.y)*k};}
function setup(){
  K.a=sec(M).start; K.close=sec('vid-close').start;
  K.match=wt(/^match$/,0); K.symmetry=wt(/^symmetry$/,0); K.mirror=wt(/^mirror$/,0);
  K.some=wt(/^Some$/,0); K.more=wt(/^more$/,0); K.none=wt(/^none$/,0);
  K.compass=wt(/^compass$/,0); K.radius=wt(/^radius$/,0); K.around=wt(/^around$/,0); K.diameter=wt(/^diameter$/,0); K.wider=wt(/^wider$/,0);
  K.watch=wt(/^Watch$/,0); K.cut=wt(/^Cut$/,0); K.size=wt(/^size$/,0); K.nomatch=wt(/^match$/,2);
}
function poly(Vp,fill,stroke,w,op){return S('polygon',{points:Vp.map(function(p){return p.x+','+p.y;}).join(' '),fill:fill,stroke:stroke,'stroke-width':w||7,'stroke-linejoin':'round',opacity:op==null?1:op});}
function V(a){return a.map(function(p){return {x:p[0],y:p[1]};});}
function dash(a,b,col,op,w){return S('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:col||GOLD,'stroke-width':w||6,'stroke-dasharray':'16 12','stroke-linecap':'round',opacity:op==null?1:op});}
// reflect a point across the vertical line x=ax
function mir(p,ax){return {x:2*ax-p.x,y:p.y};}
// the fold: every point slides from where it is to its mirror place (k from 0 to 1)
function folded(Vp,ax,k){return Vp.map(function(p){return lerp(p,mir(p,ax),k);});}
// a circle drawn by a compass: the arc grows from the top, clockwise
function arcGrow(c,r,k,col,w,op){
  if(k<=0)return; if(k>=1){S('circle',{cx:c.x,cy:c.y,r:r,fill:'none',stroke:col||NV,'stroke-width':w||7,opacity:op==null?1:op});return;}
  var C=2*Math.PI*r;S('circle',{cx:c.x,cy:c.y,r:r,fill:'none',stroke:col||NV,'stroke-width':w||7,opacity:op==null?1:op,
    'stroke-dasharray':(C*k)+' '+C,transform:'rotate(-90 '+c.x+' '+c.y+')'});
}
// a simple compass standing on the paper: needle at n, pencil r to the right, hinge above
function compass(n,r,op,k){
  var px=n.x+r, hx=(n.x+px)/2, hy=n.y-230, a={x:hx,y:hy};
  if(k){var th=2*Math.PI*k-Math.PI/2;px=n.x+r*Math.cos(th);var py=n.y+r*Math.sin(th);
    ln(a,{x:px,y:py},'#8792A8',11,op);ln(a,n,'#8792A8',11,op);
    S('polygon',{points:[px+','+py,(px-11)+','+(py-30),(px+11)+','+(py-30)].join(' '),fill:'#E8B64C',stroke:NV,'stroke-width':3,opacity:op});}
  else{ln(a,n,'#8792A8',11,op);ln(a,{x:px,y:n.y},'#8792A8',11,op);
    S('polygon',{points:px+','+n.y+' '+(px-11)+','+(n.y-30)+' '+(px+11)+','+(n.y-30),fill:'#E8B64C',stroke:NV,'stroke-width':3,opacity:op});}
  S('circle',{cx:a.x,cy:a.y,r:16,fill:'#C9CFDC',stroke:NV,'stroke-width':3,opacity:op});
  S('circle',{cx:n.x,cy:n.y,r:9,fill:NV,opacity:op});
}
function ruler(x0,y,cm,n,op){
  S('rect',{x:x0-22,y:y,width:n*cm+44,height:52,rx:10,fill:'#F6EFDC',stroke:'#C9B280','stroke-width':3,opacity:op});
  for(var i=0;i<=n;i++)ln({x:x0+i*cm,y:y},{x:x0+i*cm,y:y+(i%5===0?26:17)},NV,i%5===0?3:2,op);
}
function render(t){
  window.__t=t;var book=document.getElementById('book'),cap=document.getElementById('cap');
  cap.textContent=window.NOCAP?'':caption(t);
  var inOpen=t<K.a-0.3, inClose=t>=K.close-0.3;
  book.classList.toggle('on',inOpen||inClose);
  if(inClose){document.getElementById('btt').textContent='Your turn';document.getElementById('bq').textContent='Fold it, check it, and count the lines.';}
  sv.innerHTML='';if(inOpen||inClose)return;

  // ── scene 1: fold a paper arrow down the middle; the halves land on each other
  if(t<K.some-0.4){
    var o=fadeIn(t,K.a-0.3),AX=640;
    var AR=V([[640,150],[850,360],[745,360],[745,560],[535,560],[535,360],[430,360]]);
    poly(AR,'#FBF6EA',NV,8,o);
    dash({x:AX,y:110},{x:AX,y:600},GOLD,o);
    big(640,96,'Fold it on the line',NV,36,o);
    if(t>=K.match-0.6){
      var k=ease((t-(K.match-0.6))/1.1);
      // the left half of the arrow, in order around its outline, flipped over the fold line
      var LEFT=V([[640,150],[430,360],[535,360],[535,560],[640,560]]);
      poly(folded(LEFT,AX,k),'rgba(30,140,90,.22)',GR,8,1);
      if(k>=1&&t>=K.match-0.1)pill(640,612,'the two halves match exactly',GR,fadeIn(t,K.match-0.1),26);
    }
    if(t>=K.mirror-0.3){var mo=fadeIn(t,K.mirror-0.3);
      pill(1050,250,'mirror image',GR,mo,24);
      pill(230,250,'mirror image',GR,mo,24);}
  }
  // ── scene 2: none, one, more than one
  else if(t<K.compass-0.4){
    var o2=fadeIn(t,K.some-0.4);
    big(640,96,'How many lines of symmetry?',NV,36,o2);
    var IS=V([[230,520],[430,520],[330,250]]);
    poly(IS,'#FBF6EA',NV,8,o2);dash({x:330,y:226},{x:330,y:548},GOLD,o2);
    pill(330,580,'exactly one',GR,o2,24);
    if(t>=K.more-0.4){var mo2=fadeIn(t,K.more-0.4);
      var EQ=V([[540,520],[780,520],[660,312]]);
      poly(EQ,'#FBF6EA',NV,8,mo2);
      dash({x:660,y:288},{x:660,y:548},GOLD,mo2);
      dash({x:526,y:528},{x:734,y:408},GOLD,mo2);dash({x:794,y:528},{x:586,y:408},GOLD,mo2);
      pill(660,580,'more than one',GR,mo2,24);}
    if(t>=K.none-0.4){var no2=fadeIn(t,K.none-0.4);
      var SC=V([[890,520],[1160,495],[1010,290]]);
      poly(SC,'#FBF6EA',NV,8,no2);
      pill(1025,580,'none at all',NO,no2,24);}
  }
  // ── scene 3: the compass draws a circle; radius, diameter, then a wider opening
  else if(t<K.watch-0.4){
    var o3=fadeIn(t,K.compass-0.4),C={x:430,y:420},R=150,R2=215;
    big(640,96,'A compass draws circles',NV,36,o3);
    ruler(300,100,42,8,o3);
    var turn=t>=K.around-0.4?ease((t-(K.around-0.4))/1.3):0;
    arcGrow(C,R,turn,NV,7,o3);
    if(turn<1)compass(C,R,o3,turn>0?turn:0);           // the pencil lifts once the circle is closed
    else S('circle',{cx:C.x,cy:C.y,r:9,fill:NV,opacity:o3});
    if(t>=K.radius-0.3){var ro=fadeIn(t,K.radius-0.3);
      ln(C,{x:C.x+R,y:C.y},'#C26A0A',6,ro);pill(470,380,'radius',"#C26A0A",ro,22);}
    if(t>=K.diameter-0.3){var dO=fadeIn(t,K.diameter-0.3);
      ln({x:C.x-R,y:C.y},{x:C.x+R,y:C.y},GR,6,dO);ln(C,{x:C.x+R,y:C.y},'#C26A0A',6,dO);
      pill(C.x,C.y+72,'diameter: twice the radius',GR,dO,22);}
    if(t>=K.wider-0.3){var wo=fadeIn(t,K.wider-0.3);
      arcGrow({x:980,y:400},R2,ease((t-(K.wider-0.3))/1.1),NV,7,wo);
      S('circle',{cx:980,cy:400,r:9,fill:NV,opacity:wo});
      pill(980,160,'wider opening, bigger circle',GR,wo,24);}
  }
  // ── scene 4: watch out, equal halves are not enough
  else {
    var o4=fadeIn(t,K.watch-0.4);
    S('rect',{x:160,y:50,width:960,height:62,rx:14,fill:'#FBE7E4',stroke:NO,'stroke-width':3,opacity:o4});
    big(640,92,'Watch out! Equal halves are not enough.',NO,30,o4);
    var RC=V([[420,320],[900,320],[900,560],[420,560]]);
    poly(RC,'#FBF6EA',NV,8,o4);
    if(t>=K.cut-0.3){var co=fadeIn(t,K.cut-0.3);
      dash(RC[0],RC[2],GOLD,co);
      pill(640,640,'same size, but they do not match',NO,fadeIn(t,K.size-0.3),24);}
    if(t>=K.nomatch-1.0){
      var k4=ease((t-(K.nomatch-1.0))/1.1);
      // the lower-left triangle flips over the cut line: a corner lands outside the rectangle
      var tri=[RC[0],RC[2],RC[3]];
      var flip=tri.map(function(p){
        var a=RC[0],b=RC[2],dx=b.x-a.x,dy=b.y-a.y,L=dx*dx+dy*dy;
        var u=((p.x-a.x)*dx+(p.y-a.y)*dy)/L,f={x:a.x+u*dx,y:a.y+u*dy};
        return lerp(p,{x:2*f.x-p.x,y:2*f.y-p.y},k4);});
      poly(flip,'rgba(178,58,46,.22)',NO,8,1);
      if(k4>=1){ex(flip[2].x+62,flip[2].y+44,1);pill(960,210,'this corner sticks out',NO,1,22);}
    }
  }
}
function ex(x,y,o){S('path',{d:'M'+(x-26)+' '+(y-26)+' L'+(x+26)+' '+(y+26)+' M'+(x+26)+' '+(y-26)+' L'+(x-26)+' '+(y+26),stroke:NO,'stroke-width':8,'stroke-linecap':'round',opacity:o});}
window.init=function(tl){TL=tl;setup();};
</script></body></html>
