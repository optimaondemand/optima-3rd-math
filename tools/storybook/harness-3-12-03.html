<script>
var TL=null, NSV='http://www.w3.org/2000/svg';

  for(var i=0;i<all.length;i++){var a=all[i][0].t,b=all[i][all[i].length-1].e+0.35;if(t>=a-0.1&&t<=b)return all[i].map(function(w){return w.w;}).join(' ');}return '';}

function P(v,d,r){var a=d*Math.PI/180;return {x:v.x+r*Math.cos(a),y:v.y-r*Math.sin(a)};}
function ln(a,b,col,w,op,dash){return S('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:col,'stroke-width':w||7,'stroke-linecap':'round',opacity:op==null?1:op,'stroke-dasharray':dash||''});}

function angle(v,b,a,L1,L2,col,op,opt){opt=opt||{};ln(v,P(v,b,L1),NV,opt.w||8,op);ln(v,P(v,b+a,L2),col||GR,opt.w||8,op);

  sqmark(c,rot,'#A58B4F',op,18);}
// torn scrap outline (bumpy all round), centered at c
function scrap(c,w,h,op,flatBottom,flatLeft){var pts=[],B=18;
  function push(x,y,bump){pts.push((x+(bump?B*Math.sin(x*.13+y*.11):0))+','+(y+(bump?B*Math.cos(x*.09-y*.12):0)));}
  var x0=c.x-w/2,x1=c.x+w/2,y0=c.y-h/2,y1=c.y+h/2;

  for(var y=y1;y>=y0;y-=40)push(x0,y,!flatLeft);

function setup(){

function render(t){

    } else if(t<K.fold2-0.2){ // folded once: straight bottom edge

      ln({x:C.x-262,y:C.y+145},{x:C.x+262,y:C.y+145},'#A58B4F',5,1);

      if(t>=K.corner1+1.1)pill(880,365,'a right angle',GR,fadeIn(t,K.corner1+1.1),28);
      if(t>=K.checker1-0.4)pill(880,470,'your right-angle checker',GOLD,fadeIn(t,K.checker1-0.4),26);

      if(t>=K.sticks-0.5){var go=fadeIn(t,K.sticks-0.5);angle(V2,0,132,300,300,GR,go,{w:9});checker(V2,0,250,go*.9);pill(V2.x+40,V2.y+64,'greater than a right angle',GR,fadeIn(t,K.sticks),24);}

      S('polygon',{points:pts.map(function(p){return p.x+','+p.y;}).join(' '),fill:'#EAF4EE',stroke:NV,'stroke-width':6,opacity:o3});

    var V6={x:520,y:500},o6=fadeIn(t,K.watch-0.3);
    angle(V6,0,101,380,330,GR,o6,{w:9,r:70});checker(V6,0,290,o6*.92);
    if(t>=K.gap-0.3){var gpo=fadeIn(t,K.gap-0.3);S('path',{d:'M'+V6.x+' '+V6.y+' L'+P(V6,90,290).x+' '+P(V6,90,290).y+' A290 290 0 0 0 '+P(V6,101,290).x+' '+P(V6,101,290).y+' Z',fill:'rgba(178,58,46,.25)',opacity:gpo});
      pill(1000,280,'the checker shows a gap',NO,gpo,24);}
